name: Bug report
description: Report a reproducible problem in the application or deployment.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove personal content, email addresses, tokens, server addresses, and private logs before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.7.3 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
